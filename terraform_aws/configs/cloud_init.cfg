#cloud-config
# vim: syntax=yaml
#
# ***********************
# 	---- for more examples look at: ------
# ---> https://cloudinit.readthedocs.io/en/latest/topics/examples.html
# ******************************
#
# This is the configuration syntax that the write_files module
# will know how to understand. encoding can be given b64 or gzip or (gz+b64).
# The content will be decoded accordingly and then written to the path that is
# provided.
#
# Note: Content strings here are truncated for example purposes.
package_update: true
packages:
  - vim
  - zsh
  - python3
  - ipvsadm
  - ipset
  - curl
  - rsync
  - less
  - jq
  - file
  - tcpdump
%{ if ami_type == "ubuntu" ~}
  - apt-transport-https
  - tig
%{ endif ~}
%{ if ami_type == "ubuntu" ~}
# bootcmd runs early enough on every boot to beat the apt-daily timers, which would otherwise hold the dpkg
# lock right when Ansible's first apt task comes along and leave it sitting in its retry loop for minutes
bootcmd:
  - [ systemctl, disable, --now, apt-daily.timer, apt-daily-upgrade.timer ]
  - [ systemctl, mask, apt-daily.service, apt-daily-upgrade.service ]
%{ endif ~}
%{ if enable_ssm ~}
%{ if ami_type == "ubuntu" ~}
runcmd:
  - [ snap, wait, system, seed.loaded ]
  - [ sh, -c, "snap list amazon-ssm-agent >/dev/null 2>&1 || snap install amazon-ssm-agent --classic" ]
  - [ snap, start, amazon-ssm-agent ]
%{ else ~}
%{ if ami_type == "rocky" ~}
runcmd:
  # We install from the regional bucket because its "latest" tracks the SSM update manifest, whereas the
  # ec2-downloads-windows one lags behind it. If they differ, the AWS-UpdateSSMAgent association upgrades and
  # restarts the agent right after registration, which drops any Ansible session that happens to be open.
  - [ sh, -c, "rpm -q amazon-ssm-agent >/dev/null 2>&1 || dnf install -y https://s3.${region}.amazonaws.com/amazon-ssm-${region}/latest/linux_amd64/amazon-ssm-agent.rpm" ]
  - [ systemctl, enable, --now, amazon-ssm-agent ]
%{ endif ~}
%{ endif ~}
users:
  - default
  - name: ssm-user
    sudo: ALL=(ALL) NOPASSWD:ALL
%{ endif ~}
write_files:
%{ if enable_ssm ~}
  - path: /etc/sudoers.d/99-ansible-ssm
    content: |
      Defaults:ssm-user !use_pty
      ssm-user ALL=(ALL) NOPASSWD:ALL
    owner: root:root
    permissions: '0440'
%{ endif ~}
  - path: /etc/sysctl.d/99-k8s.conf
    content: |
      net.bridge.bridge-nf-call-ip6tables = 1
      net.bridge.bridge-nf-call-iptables = 1
      net.ipv4.ip_forward = 1
      net.ipv4.conf.default.forwarding = 1
      net.ipv6.conf.default.forwarding = 1
      net.ipv6.conf.all.forwarding = 1
      fs.inotify.max_user_instances = 65536
      fs.inotify.max_user_watches = 262144
    owner: root:root
    permissions: '0644'
