[defaults]
# ansible-playbook finds this next to the playbooks on its own, but ad-hoc `ansible` runs don't
connection_plugins = ./ansible/playbooks/connection_plugins
# The playbooks are split into ~11 plays and every one of them would otherwise re-run setup on the same hosts.
# smart keeps facts from the first play around for the rest of the run, which is a big deal over SSM where
# each gather is a full S3 round-trip.
gathering = smart

[connection]
# Pipelining halves the round-trips per task over SSH. The aws_ssm plugin ignores it, so this is a no-op there.
pipelining = True
