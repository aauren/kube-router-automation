---
- name: Check if Local Manifests Directory Exists
  stat:
    path: "{{ playbook_dir }}/../../manifests"
  register: manifests_dir
  delegate_to: localhost

- name: Deploy Manifests
  block:
    - name: Create Manifest Dir
      file:
        path: "~/misc_manifests"
        state: directory
        mode: "0750"

    # copy does a full round-trip per file, which adds up to ~30s through the SSM tunnel. rsync ships the
    # whole tree in one session. use_ssh_args is what carries the ProxyCommand over from the inventory.
    - name: Push Manifests to Leader
      synchronize:
        src: ../../../../../manifests/
        # A relative rsync dest lands in the remote user's home without depending on ~ expansion
        dest: misc_manifests
        use_ssh_args: true
        rsync_opts:
          - "--chmod=D0750,F0640"

    - name: Find Manifest Files
      find:
        paths: "~/misc_manifests"
        patterns: "*.yaml,*.yml"
      register: manifest_files

    - name: Recursively Apply Manifests
      command: kubectl apply -f {{ item.path }}
      with_items: "{{ manifest_files.files }}"

  when: manifests_dir.stat.exists
