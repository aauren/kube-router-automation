---

# cloudinit / libvirt Terraform don't seem to set an acceptable hostname value and leave it as ubuntu. So let's set it
- name: Set a Hostname
  hostname:
    name: "{{ inventory_hostname }}"

# We have some pending sysctl changes that need to be enacted on all systems
- name: Update sysctl
  command: sysctl --system

# This goes first so that unattended-upgrades stops competing with us for the dpkg lock as early as possible. On a
# fresh Ubuntu boot it can hold the lock for minutes, which is what the long retry loops below are waiting on.
- name: Disable Unattended apt Upgrades
  apt:
    name: unattended-upgrades
    state: absent
  register: apt_unattended_status
  until: apt_unattended_status is success
  delay: 6
  retries: 20
  when: ansible_facts['pkg_mgr'] == "apt"

# cloud-init already ran apt update on first boot, so we only refresh if the lists are stale
- name: Install Standard Network Utils (apt)
  apt:
    name:
      - iputils-ping
      - dnsutils
      - tcpdump
      - iperf3
      - ndisc6
      - gpg
      - iproute2
    update_cache: true
    cache_valid_time: 3600
  register: apt_status
  until: apt_status is success
  delay: 6
  retries: 20
  when: ansible_facts['pkg_mgr'] == "apt"

- name: Install Standard Network Utils (dnf)
  dnf:
    name:
      - iputils
      - dnsutils
      - tcpdump
      - iperf3
      - iproute
      # This isn't available in rocky linux - ndisc6
    update_cache: true
  register: dnf_status
  until: dnf_status is success
  delay: 6
  retries: 20
  when: ansible_facts['pkg_mgr'] == "dnf"

# The Rocky cloud images ship a minimal kernel (kernel-core + kernel-modules-core) that doesn't include br_netfilter,
# which lives in kernel-modules. dnf will only install kernel-modules for the newest kernel-core, so if a package
# update during cloud-init pulled in a newer kernel we have to reboot into it before the module is usable.
- name: Ensure kernel-modules is Installed (dnf)
  dnf:
    name: kernel-modules
  register: dnf_kmods_status
  until: dnf_kmods_status is success
  delay: 6
  retries: 20
  when: ansible_facts['pkg_mgr'] == "dnf"

- name: Find Newest Installed Kernel (dnf)
  shell: rpm -q --qf '%{VERSION}-%{RELEASE}.%{ARCH}\n' kernel-core | sort -V | tail -n1
  register: newest_kernel
  changed_when: false
  when: ansible_facts['pkg_mgr'] == "dnf"

- name: Reboot Into Newest Kernel (dnf)
  reboot:
    reboot_timeout: 600
  when:
    - ansible_facts['pkg_mgr'] == "dnf"
    - newest_kernel.stdout != ansible_facts['kernel']

# Newer iproute2 (Ubuntu 26.04+, Debian trixie+) ships its config under
# /usr/share/iproute2 and no longer creates /etc/iproute2 at all. kube-router
# bind mounts /etc/iproute2/rt_tables from every node, and if that path is
# missing the container runtime creates it as a directory, so we make sure a
# real file exists on all hosts before any pods land.
- name: Check rt_tables on host
  stat:
    path: /etc/iproute2/rt_tables
  register: rt_tabs

- name: Check for packaged rt_tables
  stat:
    path: /usr/share/iproute2/rt_tables
  register: pkg_rt_tabs

- name: Remove rt_tables if a container runtime turned it into a directory
  file:
    path: /etc/iproute2/rt_tables
    state: absent
  when: rt_tabs.stat.exists and rt_tabs.stat.isdir

- name: Ensure /etc/iproute2 exists
  file:
    path: /etc/iproute2
    state: directory
    mode: '0755'

- name: Copy packaged rt_tables into /etc/iproute2
  copy:
    remote_src: true
    src: /usr/share/iproute2/rt_tables
    dest: /etc/iproute2/rt_tables
    mode: '0644'
  when: (not rt_tabs.stat.exists or rt_tabs.stat.isdir) and pkg_rt_tabs.stat.exists

- name: Write default rt_tables when no packaged copy exists
  copy:
    dest: /etc/iproute2/rt_tables
    mode: '0644'
    content: |
      #
      # reserved values
      #
      255     local
      254     main
      253     default
      0       unspec
      #
      # local
      #
      #1     inr.ruhep
  when: (not rt_tabs.stat.exists or rt_tabs.stat.isdir) and not pkg_rt_tabs.stat.exists
