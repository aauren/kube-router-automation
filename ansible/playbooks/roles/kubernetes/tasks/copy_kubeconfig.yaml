---

# The plays that import this run with become, so the gathered facts describe root. One shell round-trip gets us
# the unprivileged user's identity instead of three.
- name: Find User Identity
  become: false
  shell: echo "$(id -u) $(id -g) ${HOME}"
  register: user_ident
  changed_when: false

- name: Set User Identity Facts
  set_fact:
    user_id: "{{ user_ident.stdout.split()[0] }}"
    group_id: "{{ user_ident.stdout.split()[1] }}"
    home: "{{ user_ident.stdout.split()[2] }}"

- name: Output UID & GID
  debug:
    msg: "User ID: {{ user_id }} / Group ID: {{ group_id }}"

- name: Create kube Config Dir in User's Home
  file:
    path: "{{ home }}/.kube"
    state: directory
    mode: '0750'
    owner: "{{ user_id }}"
    group: "{{ group_id }}"

# The leader's admin.conf is the same for every host in the play, so we only need to fetch it once
- name: Grab Kube Config from Leader
  slurp:
    src: /etc/kubernetes/admin.conf
  delegate_to: "{{ item }}"
  register: kube_config
  loop: "{{ groups['leader'] }}"
  run_once: true

- name: Copy Kube Config to Home
  copy:
    # Because we used a loop command (even over just one host) we have to parse results to get to stdout
    content: "{{ kube_config['results'][0]['content'] | b64decode }}"
    dest: "{{ home }}/.kube/config"
    mode: '0600'
    owner: "{{ user_id }}"
    group: "{{ group_id }}"
