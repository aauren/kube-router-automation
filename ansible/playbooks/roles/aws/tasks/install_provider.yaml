---

# Facts are gathered under become, so ansible_facts['env'].HOME is /root even though this play runs as the
# unprivileged user. Path args expand ~ on the remote for the effective user, so we use that instead.
- name: Create Manifest Dir
  file:
    path: "~/manifests"
    state: directory
    mode: '0750'

- name: Copy AWS manifests
  synchronize:
    src: ../files/
    # A relative rsync dest lands in the remote user's home without depending on ~ expansion
    dest: manifests
    use_ssh_args: true
    rsync_opts:
      - "--chmod=D0750,F0640"

- name: Generate AWS cloud-config ConfigMap
  template:
    src: templates/aws_provider_configmap.yaml.j2
    dest: "~/manifests/aws_provider_configmap.yaml"

- name: Generate AWS cloud-config daemonset
  template:
    src: templates/aws_provider_daemonset.yaml.j2
    dest: "~/manifests/aws_provider_manager_daemonset.yaml"

- name: Concatenate Manifests
  shell: "cat ~/manifests/aws_provider_*.yaml > ~/manifests/aws_all.yaml"

- name: Deploy AWS Provider Service Account Manifest
  command: kubectl apply -f ~/manifests/aws_all.yaml
